services:
  - type: web
    name: nexgen-frontier-lab
    runtime: node
    region: oregon
    plan: starter

    buildCommand: npm install && npx prisma generate && npx prisma db push

    startCommand: node server.js

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexgen-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false          # Required — set in Render dashboard
      - key: OPENAI_API_KEY
        sync: false          # Optional — enables pgvector embeddings in RAG
      - key: LANGFUSE_SECRET_KEY
        sync: false          # Optional — enables Langfuse trace forwarding
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false          # Default: https://cloud.langfuse.com
      - key: MLFLOW_TRACKING_URI
        sync: false          # Optional — e.g. https://your-mlflow-server.com
      - key: GCP_PROJECT
        sync: false          # Optional — Vertex AI project ID
      - key: GCP_REGION
        value: us-central1

    healthCheckPath: /api/health

databases:
  - name: nexgen-postgres
    plan: free
    region: oregon
    # Render's managed PostgreSQL includes the pgvector extension
    # on postgres 15+. Enabled automatically on first startup.
