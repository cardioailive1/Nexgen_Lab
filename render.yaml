# NexGen — Render.com Blueprint
# Deploys the Frontier Lab (Node.js) + PostgreSQL from this repo.
#
# The NexGen product (product/index.html) is a static site —
# deploy it separately: Render dashboard → New → Static Site → same repo → Root Dir: product
#
# Deploy this Blueprint: Render → New → Blueprint → connect this repo

services:

  # ── NexGen Frontier Lab (Node.js web service) ─────────────────────────────
  - type: web
    name: nexgen-frontier-lab
    rootDir: lab
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm install && npx prisma generate && npx prisma db push && cp -f ../product/index.html static/product.html && cp -f ../product/pricing.html static/pricing.html || true
    startCommand: node server.js
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexgen-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
      - key: MLFLOW_TRACKING_URI
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: GCP_REGION
        value: us-central1
      - key: GITHUB_REPO
        sync: false
      - key: NEXGEN_INFERENCE_URL
        sync: false

# ── PostgreSQL database ────────────────────────────────────────────────────────
databases:
  - name: nexgen-postgres
    plan: free
    region: oregon
