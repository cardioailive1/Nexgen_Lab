services:
  - type: web
    name: corverxis-platform
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: corverxis-db
          property: connectionString
      - key: APP_URL
        sync: false          # Set manually in Render dashboard to your full https:// URL
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYROLL_CREDENTIALS_KEY
        generateValue: true  # 32-byte key (base64) used to encrypt Gusto/ADP/Intuit credentials at rest
      - key: PLATFORM_ADMIN_SECRET
        generateValue: true  # gates POST /api/internal/provision-client — only internal Corverxis staff should have this value. Retrieve it from Render's dashboard after first deploy, don't commit it anywhere.
      - key: ADMIN_EMAIL
        value: admin@corverxis.com
      - key: GOOGLE_CLIENT_ID
        sync: false          # Set in Render dashboard after creating Google OAuth app
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AZURE_AD_CLIENT_ID
        sync: false
      - key: AZURE_AD_CLIENT_SECRET
        sync: false
      - key: AZURE_AD_TENANT_ID
        sync: false
      - key: ERP_API_KEY
        generateValue: true    # auto-generated secure key for ERP systems
      - key: QUALITY_EMAIL
        sync: false            # email address for NCR/WO notifications
      - key: SMTP_HOST
        sync: false            # e.g. smtp.gmail.com or smtp.sendgrid.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false            # e.g. "Corverxis Platform <noreply@corverxis.com>"

databases:
  - name: corverxis-db
    plan: free
    databaseName: corverxis
    user: corverxis
