# NexGen — Render.com Blueprint (Monorepo)
# Covers two services from the same GitHub repo:
#   1. nexgen-frontier-lab   — the internal engineering lab (Node.js + PostgreSQL)
#   2. nexgen-product         — the public NexGen AI assistant (static site)
#
# Deploy: Render → New → Blueprint → connect this repo → Render reads this file.

services:

  # ── Internal Frontier Lab ────────────────────────────────────────────────────
  - type: web
    name: nexgen-frontier-lab
    rootDir: lab                   # points at /lab subfolder in this repo
    runtime: node
    region: oregon
    plan: starter

    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node server.js
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexgen-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — never commit real keys
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
      - key: MLFLOW_TRACKING_URI
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: GCP_REGION
        value: us-central1
      - key: GITHUB_REPO
        sync: false              # e.g. corverxis/nexgen  — used by lab's GitHub panel

  # ── Public NexGen Product (static site) ──────────────────────────────────────
  - type: static
    name: nexgen-product
    rootDir: product             # points at /product subfolder in this repo
    staticPublishPath: .
    buildCommand: echo "No build step — single HTML file"
    pullRequestPreviewsEnabled: true   # preview URLs on every PR

    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Shared PostgreSQL database ─────────────────────────────────────────────────
databases:
  - name: nexgen-postgres
    plan: free
    region: oregon
