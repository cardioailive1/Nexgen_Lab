<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorverxisLab | AI Engineering &amp; Data Infrastructure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0a1628;--navy2:#0d1f3c;--navy3:#112645;
  --ocean:#00c2e0;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --text:#e2e8f0;--muted:#6b7280;--text2:#9ca3af;--border:rgba(255,255,255,0.08);
}
body{background:var(--navy);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden;}
.shell{display:grid;grid-template-columns:250px 1fr;height:100vh;}
.sidebar{background:var(--navy2);border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;}
.main{overflow-y:auto;padding:24px 32px;}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:22px;padding:4px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00c2e0,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#0a1628;flex-shrink:0}
.logo-text{font-size:14px;font-weight:800}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.5px}
.proj-select{width:100%;padding:9px 10px;background:var(--navy3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;margin-bottom:18px;cursor:pointer}
.nav-section-label{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin:14px 0 6px 8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:12.5px;color:var(--text2);transition:all .15s;border:1px solid transparent}
.nav-item:hover{background:var(--navy3);color:var(--text)}
.nav-item.active{background:rgba(0,194,224,.1);border-color:rgba(0,194,224,.3);color:#00c2e0;font-weight:700}
.nav-icon{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted)}
.pt{font-size:22px;font-weight:800;margin-bottom:4px}
.ps{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi-l{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.kpi-v{font-size:22px;font-weight:800;margin-bottom:2px}
.kpi-s{font-size:10px;color:var(--muted)}
.card{background:var(--navy2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.ct{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2)}
tr:last-child td{border-bottom:none}
.badge{font-size:9.5px;padding:2px 8px;border-radius:4px;font-weight:700;display:inline-block}
.badge.ok{background:rgba(34,197,94,.15);color:#22c55e}
.badge.warn{background:rgba(245,158,11,.15);color:#f59e0b}
.badge.err{background:rgba(239,68,68,.15);color:#ef4444}
.badge.info{background:rgba(0,194,224,.15);color:#00c2e0}
.badge.muted{background:rgba(107,114,128,.15);color:#9ca3af}
.btn{padding:8px 16px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.btn-primary{background:#00c2e0;color:#0a1628}
.btn-secondary{background:var(--navy3);color:var(--text2);border:1px solid var(--border)}
.tab-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:7px 14px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2)}
.tab-btn.active{background:rgba(0,194,224,.12);border-color:rgba(0,194,224,.35);color:#00c2e0}
.progress-bar{height:5px;background:var(--navy3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#00c2e0,#22c55e);transition:width .4s ease}
.phase-track{display:flex;gap:4px;margin-bottom:18px}
.phase-step{flex:1;text-align:center;padding:10px 6px;border-radius:8px;background:var(--navy3);border:1px solid var(--border);font-size:10px;color:var(--muted);cursor:default}
.phase-step.done{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#22c55e}
.phase-step.current{background:rgba(0,194,224,.12);border-color:rgba(0,194,224,.4);color:#00c2e0;font-weight:700}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.module-card{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s}
.module-card:hover{border-color:rgba(0,194,224,.3);transform:translateY(-1px)}
.module-icon{width:34px;height:34px;border-radius:8px;background:rgba(0,194,224,.12);color:#00c2e0;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}
.module-title{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.module-desc{font-size:10.5px;color:var(--muted);line-height:1.4}
#modal-overlay{position:fixed;inset:0;background:rgba(5,10,20,.72);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#0d1f3c;border:1px solid rgba(0,194,224,.25);border-radius:12px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#9ca3af;margin-bottom:4px}
.field select,.field input,.field textarea{width:100%;padding:8px;background:#112645;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
#toast{position:fixed;bottom:24px;right:24px;z-index:3000;background:#0d1f3c;border-left:4px solid #22c55e;border-radius:8px;padding:12px 18px;color:#e2e8f0;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:all .25s ease}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-mark">CL</div>
      <div><div class="logo-text">CorverxisLab</div><div class="logo-sub">AI ENGINEERING &amp; DATA INFRA</div></div>
    </div>
    <select class="proj-select" id="project-select" onchange="onProjectChange(this.value)"></select>

    <div class="nav-section-label">Build Environment</div>
    <div class="nav-item active" data-tab="overview" onclick="showTab('overview')"><span class="nav-icon">◈</span>Overview</div>
    <div class="nav-item" data-tab="onboarding" onclick="showTab('onboarding')"><span class="nav-icon">⬡</span>Site Onboarding</div>
    <div class="nav-item" data-tab="infra" onclick="showTab('infra')"><span class="nav-icon">⟐</span>Data Infrastructure</div>
    <div class="nav-item" data-tab="datasets" onclick="showTab('datasets')"><span class="nav-icon">⊞</span>Datasets</div>
    <div class="nav-item" data-tab="training" onclick="showTab('training')"><span class="nav-icon">✎</span>Training Pipelines</div>
    <div class="nav-item" data-tab="models" onclick="showTab('models')"><span class="nav-icon">⊛</span>Models</div>

    <div class="nav-section-label">All Projects</div>
    <div class="nav-item" data-tab="allprojects" onclick="showTab('allprojects')"><span class="nav-icon">⊡</span>Every Pilot's Lab</div>

    <div class="nav-section-label">Org Settings</div>
    <div class="nav-item" data-tab="orgsettings" onclick="showTab('orgsettings')"><span class="nav-icon">⚙</span>Active Verticals</div>

    <div class="sidebar-footer">
      <div id="lab-live-badge" style="color:#f59e0b">CONNECTING…</div>
      <div style="margin-top:4px">CorverxisLab v1.0 · Corverxis Technologies</div>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CorverxisLab — the technical build environment behind every
//  pilot study: site onboarding & data integration, data
//  infrastructure, dataset management, training pipelines, and
//  ML/LLM model training. Reads/writes /api/v1/lab/* on the
//  CorverxisONE backend.
// ══════════════════════════════════════════════════════════════

var PILLAR_LABELS = {
  PREDICTIVE_MAINTENANCE: 'Predictive Maintenance', QUALITY_CONTROL: 'Computer Vision QC',
  SUPPLY_CHAIN: 'Supply Chain AI', PROCESS_OPTIMIZATION: 'Process Optimization', GENERAL: 'General',
};
var PILLAR_COLORS = {
  PREDICTIVE_MAINTENANCE: '#8b5cf6', QUALITY_CONTROL: '#00c2e0',
  SUPPLY_CHAIN: '#f59e0b', PROCESS_OPTIMIZATION: '#22c55e', GENERAL: '#6b7280',
};
var PHASE_ORDER = ['SITE_ONBOARDING','DATA_INFRASTRUCTURE','COLLECTION_PROCESSING','TRAINING_PIPELINE','MODEL_TRAINING','VALIDATION'];
var PHASE_LABELS = {
  SITE_ONBOARDING: 'Site Onboarding', DATA_INFRASTRUCTURE: 'Data Infra', COLLECTION_PROCESSING: 'Collect & Process',
  TRAINING_PIPELINE: 'Training Pipeline', MODEL_TRAINING: 'Model Training', VALIDATION: 'Validation',
};
var SOURCE_TYPE_LABELS = { ERP:'ERP', MES:'MES', IIOT_SENSOR:'IIoT Sensor', SCADA_HISTORIAN:'SCADA/Historian', VISION_CAMERA:'Vision Camera', FILE_UPLOAD:'File Upload', API_FEED:'API Feed' };
var STAGE_LABELS = { INGESTION:'Ingestion', CLEANING:'Cleaning', TRANSFORMATION:'Transformation', FEATURE_ENGINEERING:'Feature Engineering', LABELING:'Labeling' };
var MODELTYPE_LABELS = { CLASSICAL_ML:'Classical ML', TIME_SERIES:'Time-Series', VISION:'Vision', LLM:'LLM' };
var ORIGIN_LABELS = { EXISTING:'Existing — Reused', NEW_BUILD:'New Build', HYBRID:'Hybrid' };
var ORIGIN_BADGE_CLS = { EXISTING:'info', NEW_BUILD:'warn', HYBRID:'muted' };
// The real 18 verticals from the standalone SensorModel product's catalog —
// used as a fallback list in the Add Data Source picker so all verticals
// are browsable even if the org hasn't set any as "active" yet.
var ALL_SENSORMODEL_VERTICALS = [
  'Manufacturing', 'Industrial Automation', 'Healthcare', 'Aerospace', 'EV Battery',
  'Power Systems', 'Mining', 'Renewable Energy', 'LVDT — Linear Displacement',
  'Laser Micrometers', 'Proximity Sensors', 'Force & Torque Sensors',
  'Vision & Optical Sensors', 'Hall Effect Sensors', 'Pressure Sensor Housing',
  'Temperature Sensor Components', 'Vibration Sensors', 'Current & Power Sensors',
];

var LAB_LIVE = false;
var PROJECTS = [];
var CURRENT_PROJECT_ID = null;
var CURRENT_PROJECT = null;
var ACTIVE_TAB = 'overview';

// ── Boot ─────────────────────────────────────────────────────
async function boot() {
  await loadProjects();
  var urlParams = new URLSearchParams(location.search);
  var wantPillar = urlParams.get('pillar');
  var matched = wantPillar ? PROJECTS.find(function(p){ return p.pillar === wantPillar; }) : null;
  if (matched) {
    CURRENT_PROJECT_ID = matched.id;
  } else if (PROJECTS.length) {
    CURRENT_PROJECT_ID = PROJECTS[0].id;
  }
  renderProjectSelect();
  if (CURRENT_PROJECT_ID) await loadCurrentProject();
  showTab('overview');
}

async function loadProjects() {
  try {
    var r = await fetch('/api/v1/lab/projects', { credentials:'same-origin' });
    if (!r.ok) throw new Error('unavailable');
    PROJECTS = (await r.json()).data || [];
    LAB_LIVE = true;
    _setBadge('LIVE', '#22c55e');
  } catch(e) {
    PROJECTS = [];
    LAB_LIVE = false;
    _setBadge('API UNAVAILABLE', '#ef4444');
  }
}
async function loadCurrentProject() {
  if (!CURRENT_PROJECT_ID) { CURRENT_PROJECT = null; return; }
  try {
    var r = await fetch('/api/v1/lab/projects/' + CURRENT_PROJECT_ID, { credentials:'same-origin' });
    if (!r.ok) throw new Error('unavailable');
    CURRENT_PROJECT = (await r.json()).data;
  } catch(e) { CURRENT_PROJECT = null; }
}
function _setBadge(text, color) {
  var el = document.getElementById('lab-live-badge');
  if (el) { el.textContent = text; el.style.color = color; }
}

function renderProjectSelect() {
  var sel = document.getElementById('project-select');
  if (!PROJECTS.length) {
    sel.innerHTML = '<option value="">No lab projects yet</option>';
    return;
  }
  sel.innerHTML = PROJECTS.map(function(p){
    return '<option value="'+p.id+'"'+(p.id===CURRENT_PROJECT_ID?' selected':'')+'>'+PILLAR_LABELS[p.pillar]+'</option>';
  }).join('');
}
window.onProjectChange = async function(id) {
  CURRENT_PROJECT_ID = id;
  await loadCurrentProject();
  showTab(ACTIVE_TAB);
};

// ── Tab dispatch ─────────────────────────────────────────────
window.showTab = function(tab) {
  ACTIVE_TAB = tab;
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.toggle('active', n.dataset.tab === tab); });
  var renderers = {
    overview: renderOverview, onboarding: renderOnboarding, infra: renderInfra,
    datasets: renderDatasets, training: renderTraining, models: renderModels,
    allprojects: renderAllProjects, orgsettings: renderOrgSettings,
  };
  (renderers[tab] || renderOverview)();
};

function _mainEl() { return document.getElementById('main-content'); }

function _noProjectState() {
  return '<div class="pt">CorverxisLab</div><div class="ps">The build environment behind every pilot study</div>' +
    '<div class="card" style="text-align:center;padding:36px">' +
      '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">No lab projects yet.</div>' +
      '<button class="btn btn-primary" id="seed-defaults-btn" onclick="seedDefaults()">Load Default Pilot Lab Projects (4)</button>' +
    '</div>';
}
window.seedDefaults = async function() {
  var btn = document.getElementById('seed-defaults-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    await _post('/api/v1/lab/projects/seed-defaults', {});
    await loadProjects();
    renderProjectSelect();
    if (PROJECTS.length) { CURRENT_PROJECT_ID = PROJECTS[0].id; await loadCurrentProject(); }
    showTab('overview');
  } catch(e) {
    alert('Could not load default projects: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Load Default Pilot Lab Projects (4)'; }
  }
};

// ── Overview ─────────────────────────────────────────────────
function renderOverview() {
  var el = _mainEl();
  if (!PROJECTS.length) { el.innerHTML = _noProjectState(); return; }
  var p = CURRENT_PROJECT;
  if (!p) { el.innerHTML = '<div class="pt">Loading…</div>'; return; }
  var col = PILLAR_COLORS[p.pillar];

  var sourcesConnected = p.dataSources.filter(function(d){return d.status==='CONNECTED';}).length;
  var pipelinesActive = p.pipelines.filter(function(x){return x.status==='ACTIVE';}).length;
  var jobsRunning = p.trainingJobs.filter(function(j){return j.status==='RUNNING';}).length;
  var jobsDone = p.trainingJobs.filter(function(j){return j.status==='COMPLETED';}).length;
  var modelsProd = p.models.filter(function(m){return m.status==='PRODUCTION';}).length;

  el.innerHTML =
    '<div class="pt">'+p.title+'</div>' +
    '<div class="ps">'+(p.clientSiteName||'—')+' · '+(p.description||'')+'</div>' +

    '<div class="phase-track">' +
      PHASE_ORDER.map(function(ph, i){
        var currentIdx = PHASE_ORDER.indexOf(p.phase);
        var cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
        return '<div class="phase-step '+cls+'" onclick="setPhase(\''+ph+'\')" style="cursor:pointer">'+(i<currentIdx?'✓ ':'')+PHASE_LABELS[ph]+'</div>';
      }).join('') +
    '</div>' +

    '<div class="kg">' +
      _kpi('Data Sources Connected', sourcesConnected+' / '+p.dataSources.length, '#00c2e0') +
      '<div class="kpi"><div class="kpi-l">Pipelines Active</div><div class="kpi-v" style="color:#22c55e">'+pipelinesActive+' / '+p.pipelines.length+'</div><div class="kpi-s">Ingestion → labeling</div></div>' +
      '<div class="kpi"><div class="kpi-l">Datasets Registered</div><div class="kpi-v" style="color:#8b5cf6">'+p.datasets.length+'</div><div class="kpi-s">'+p.datasets.reduce(function(a,d){return a+d.rowCount;},0).toLocaleString()+' total rows</div></div>' +
      '<div class="kpi"><div class="kpi-l">Training Jobs</div><div class="kpi-v" style="color:#f59e0b">'+jobsRunning+' running</div><div class="kpi-s">'+jobsDone+' completed</div></div>' +
      '<div class="kpi"><div class="kpi-l">Production Models</div><div class="kpi-v" style="color:'+col+'">'+modelsProd+'</div><div class="kpi-s">'+p.models.length+' total registered</div></div>' +
    '</div>' +

    '<div class="ct" style="margin-bottom:10px">Build Modules</div>' +
    '<div class="module-grid">' +
      _moduleCard('⬡','Site Onboarding','Connect ERP/MES/IIoT sources for the client plant','onboarding') +
      _moduleCard('⟐','Data Infrastructure','Ingestion, cleaning, and feature pipelines','infra') +
      _moduleCard('⊞','Datasets','Versioned training/val/test splits','datasets') +
      _moduleCard('✎','Training Pipelines','Launch and monitor ML/LLM training jobs','training') +
      _moduleCard('⊛','Models','Registry, versions, and pilot deployment','models') +
    '</div>' +

    (p.courseSlug ? '<div class="card" style="margin-top:14px"><div class="ct">Related</div>' +
      '<button class="btn btn-secondary" onclick="window.open(\'/academy?course='+p.courseSlug+'\',\'_blank\')">Open matching CorverxisAcademy course →</button></div>' : '');
}

function _kpi(label, val, color) {
  return '<div class="kpi"><div class="kpi-l">'+label+'</div><div class="kpi-v" style="color:'+color+'">'+val+'</div></div>';
}
function _moduleCard(icon, title, desc, tab) {
  return '<div class="module-card" onclick="showTab(\''+tab+'\')"><div class="module-icon">'+icon+'</div><div class="module-title">'+title+'</div><div class="module-desc">'+desc+'</div></div>';
}

window.setPhase = async function(phase) {
  if (!CURRENT_PROJECT) return;
  try {
    await _patch('/api/v1/lab/projects/'+CURRENT_PROJECT.id, { phase: phase });
    await loadCurrentProject();
    showTab('overview');
    _toast('✓ Phase updated to '+PHASE_LABELS[phase]);
  } catch(e) { alert('Could not update phase: '+e.message); }
};

// ── Site Onboarding (data sources) ──────────────────────────
function renderOnboarding() {
  var el = _mainEl();
  if (!CURRENT_PROJECT) { el.innerHTML = _noProjectState(); return; }
  var p = CURRENT_PROJECT;
  var existingCt = p.dataSources.filter(function(d){return d.origin==='EXISTING';}).length;
  var newCt = p.dataSources.filter(function(d){return d.origin==='NEW_BUILD';}).length;
  var hybridCt = p.dataSources.filter(function(d){return d.origin==='HYBRID';}).length;
  var total = p.dataSources.length || 1;
  el.innerHTML =
    '<div class="pt">Site Onboarding &amp; Data Integration</div>' +
    '<div class="ps">Connect and clean data sources at '+(p.clientSiteName||'the client site')+' before anything else can start. In practice this is almost always a mix — some of what\'s already at the plant, some built new.</div>' +
    '<div class="card" style="margin-bottom:14px">' +
      '<div class="ct" style="margin-bottom:8px">The Mix — Existing vs. New Build</div>' +
      '<div class="progress-bar" style="height:14px;border-radius:7px;overflow:hidden;display:flex">' +
        (existingCt ? '<div style="width:'+(existingCt/total*100)+'%;background:#00c2e0" title="Existing"></div>' : '') +
        (hybridCt ? '<div style="width:'+(hybridCt/total*100)+'%;background:#6b7280" title="Hybrid"></div>' : '') +
        (newCt ? '<div style="width:'+(newCt/total*100)+'%;background:#f59e0b" title="New Build"></div>' : '') +
      '</div>' +
      '<div style="display:flex;gap:14px;margin-top:8px;font-size:10.5px;color:var(--text2)">' +
        '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#00c2e0;margin-right:4px"></span>Existing — Reused ('+existingCt+')</span>' +
        '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#6b7280;margin-right:4px"></span>Hybrid ('+hybridCt+')</span>' +
        '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#f59e0b;margin-right:4px"></span>New Build ('+newCt+')</span>' +
      '</div>' +
    '</div>' +
    '<div style="display:flex;justify-content:flex-end;margin-bottom:12px">' +
      '<button class="btn btn-primary" onclick="openAddSource()">+ Add Data Source</button>' +
    '</div>' +
    '<div class="card" style="padding:0;overflow:hidden">' +
      '<table><thead><tr><th>Source</th><th>Type</th><th>Origin</th><th>Status</th><th>Records Ingested</th><th>Last Sync</th><th>Gateway Key</th><th></th></tr></thead><tbody>' +
      (p.dataSources.length ? p.dataSources.map(function(d){
        var statusCls = d.status==='CONNECTED'?'ok':d.status==='CONNECTING'?'warn':d.status==='ERROR'?'err':'muted';
        var isGatewayType = ['IIOT_SENSOR','SCADA_HISTORIAN','VISION_CAMERA'].indexOf(d.type) !== -1;
        var actions;
        if (isGatewayType) {
          actions = '<button class="btn btn-secondary" style="padding:4px 8px;font-size:10px" onclick="viewIngestionEvents(\''+d.id+'\',\''+d.name.replace(/'/g,"&#39;")+'\')">Events</button>' +
            (d.apiKeyLast4 ? ' <button class="btn btn-secondary" style="padding:4px 8px;font-size:10px" onclick="regenerateKey(\''+d.id+'\',\''+d.name.replace(/'/g,"&#39;")+'\')">Regen Key</button>' : '');
        } else {

window.openAddSource = async function() {
  var activeVerticals = [];
  try {
    var r = await fetch('/api/v1/org/verticals', { credentials:'same-origin' });
    if (r.ok) activeVerticals = (await r.json()).data.activeVerticals || [];
  } catch(e) {}

  var verticalOpts = [{value:'',label:'— configure manually, no catalog —'}];
  if (activeVerticals.length) {
    verticalOpts.push({value:'__divider_active__', label:'── This org\'s verticals ──', disabled:true});
    activeVerticals.forEach(function(v){ verticalOpts.push({value:v, label:v}); });
  }
  verticalOpts.push({value:'__divider_all__', label:'── Browse all 18 SensorModel verticals ──', disabled:true});
  ALL_SENSORMODEL_VERTICALS.forEach(function(v){
    if (activeVerticals.indexOf(v) === -1) verticalOpts.push({value:v, label:v});
  });

  var bodyHtml =
    _field('Name','name','text', null, null, true, 'Auto-filled if you pick from a catalog below') +
    _field('Type','type','select',['ERP','MES','IIOT_SENSOR','SCADA_HISTORIAN','VISION_CAMERA','FILE_UPLOAD','API_FEED'], SOURCE_TYPE_LABELS) +
    '<div id="catalog-picker-wrap" style="display:none">' +
      '<div class="field"><label>Start from SensorModel Catalog</label>' +
        '<select id="catalog-vertical-select">' + verticalOpts.map(function(o){
          return '<option value="'+o.value+'"'+(o.disabled?' disabled':'')+'>'+o.label+'</option>';
        }).join('') + '</select>' +
      '</div>' +
      '<div class="field" id="catalog-sensor-wrap" style="display:none"><label>Sensor Definition</label>' +
        '<select id="catalog-sensor-select"></select>' +
      '</div>' +
      '<input type="hidden" name="catalogEntryId" id="catalog-entry-id-input">' +
    '</div>' +
    '<div id="vision-picker-wrap" style="display:none">' +
      '<div class="field"><label>Start from CorverxisVision Part Catalog</label>' +
        '<select id="vision-part-select"><option value="">— configure manually, no catalog —</option></select>' +
      '</div>' +
      '<input type="hidden" name="visionPartId" id="vision-part-id-input">' +
    '</div>' +
    _field('Origin','origin','select',['EXISTING','NEW_BUILD','HYBRID'], ORIGIN_LABELS) +
    _field('Notes','notes','textarea', null, null, false, 'Auto-filled from the catalog entry if selected');

  openModal('Add Data Source', bodyHtml,
    async function(payload){
      var result = await _post('/api/v1/lab/projects/'+CURRENT_PROJECT.id+'/data-sources', payload);
      await loadCurrentProject();
      renderOnboarding();
      // The API key is only ever returned this one time — show it in a
      // dedicated reveal modal with a copy button, not buried in a toast.
      if (result.apiKey) {
        setTimeout(function(){ showApiKeyReveal(result.data.name, result.apiKey, result.data.id); }, 150);
      }
    },
    { onMount: function(form){
        var typeSelect = form.querySelector('select[name="type"]');
        var catalogWrap = document.getElementById('catalog-picker-wrap');
        var verticalSelect = document.getElementById('catalog-vertical-select');
        var sensorWrap = document.getElementById('catalog-sensor-wrap');
        var sensorSelect = document.getElementById('catalog-sensor-select');
        var entryIdInput = document.getElementById('catalog-entry-id-input');
        var visionWrap = document.getElementById('vision-picker-wrap');
        var visionSelect = document.getElementById('vision-part-select');
        var visionIdInput = document.getElementById('vision-part-id-input');
        var nameInput = form.querySelector('input[name="name"]');
        var notesInput = form.querySelector('textarea[name="notes"]');
        var visionPartsLoaded = false;

        function toggleCatalogVisibility(){
          catalogWrap.style.display = (typeSelect.value === 'IIOT_SENSOR') ? 'block' : 'none';
          visionWrap.style.display = (typeSelect.value === 'VISION_CAMERA') ? 'block' : 'none';
          if (typeSelect.value === 'VISION_CAMERA' && !visionPartsLoaded) loadVisionParts();
        }
        typeSelect.addEventListener('change', toggleCatalogVisibility);
        toggleCatalogVisibility();

        async function loadVisionParts(){
          visionPartsLoaded = true;
          try {
            var r = await fetch('/api/v1/catalog/vision-parts', { credentials:'same-origin' });
            var parts = r.ok ? (await r.json()).data : [];
            parts.forEach(function(p){
              var opt = document.createElement('option');
              opt.value = p.id;
              opt.textContent = p.partName + ' — defects: ' + p.applicableDefectTypes.join(', ');
              visionSelect.appendChild(opt);
            });
          } catch(e) {}
        }
        visionSelect.addEventListener('change', function(){
          visionIdInput.value = visionSelect.value;
          var opt = visionSelect.options[visionSelect.selectedIndex];
          if (opt && visionSelect.value) nameInput.value = 'Vision — ' + opt.textContent.split(' — defects:')[0];
        });

        verticalSelect.addEventListener('change', async function(){
          var v = verticalSelect.value;
          if (!v || v.indexOf('__divider') === 0) { sensorWrap.style.display = 'none'; entryIdInput.value = ''; return; }
          try {
            var r = await fetch('/api/v1/catalog/sensor-models?vertical=' + encodeURIComponent(v), { credentials:'same-origin' });
            var entries = r.ok ? (await r.json()).data : [];
            sensorSelect.innerHTML = entries.map(function(e){
              return '<option value="'+e.id+'">'+e.name+' ('+e.unit+', warn '+e.warnThreshold+', crit '+e.critThreshold+')</option>';
            }).join('');
            sensorWrap.style.display = entries.length ? 'block' : 'none';
            if (entries.length) {
              entryIdInput.value = entries[0].id;
              nameInput.value = v + ' — ' + entries[0].name;
            }
          } catch(e) { sensorWrap.style.display = 'none'; }
        });
        sensorSelect.addEventListener('change', function(){
          entryIdInput.value = sensorSelect.value;
          var opt = sensorSelect.options[sensorSelect.selectedIndex];
          if (opt) nameInput.value = verticalSelect.value + ' — ' + opt.textContent.split(' (')[0];
        });
      }
    }
  );
};

function showApiKeyReveal(sourceName, apiKey, dataSourceId) {
  var existing = document.getElementById('modal-overlay');
  if (existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal" style="max-width:520px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">' +
        '<div style="font-size:14px;font-weight:700;color:var(--text)">Gateway Agent API Key</div>' +
        '<button onclick="document.getElementById(\'modal-overlay\').remove()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button>' +
      '</div>' +
      '<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11.5px;color:#f59e0b">' +
        '⚠ This key is shown once. Copy it now — CorverxisLab cannot display it again. If it\'s lost, use \u201cRegenerate Key\u201d on this data source (which invalidates this one).' +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-bottom:6px">For: <b style="color:var(--text)">'+sourceName+'</b></div>' +
      '<div style="display:flex;gap:8px;margin-bottom:16px">' +
        '<input id="reveal-key-input" readonly value="'+apiKey+'" style="flex:1;padding:10px;background:#112645;border:1px solid var(--border);border-radius:6px;color:#22c55e;font-family:monospace;font-size:12px">' +
        '<button class="btn btn-secondary" onclick="copyRevealKey()">Copy</button>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-bottom:10px">Set this as <code>CORVERXIS_API_KEY</code> and the data source ID below as <code>CORVERXIS_DATA_SOURCE_ID</code> in the gateway agent\'s <code>.env</code> file:</div>' +
      '<div style="background:#112645;border-radius:6px;padding:10px;font-family:monospace;font-size:10.5px;color:var(--text2);margin-bottom:16px">' +
        'CORVERXIS_DATA_SOURCE_ID='+dataSourceId+'<br>CORVERXIS_API_KEY='+apiKey +
      '</div>' +
      '<button class="btn btn-primary" style="width:100%" onclick="document.getElementById(\'modal-overlay\').remove()">Done — I\'ve saved this key</button>' +
    '</div>';
  document.body.appendChild(overlay);
}
window.copyRevealKey = function() {
  var input = document.getElementById('reveal-key-input');
  input.select();
  document.execCommand && document.execCommand('copy');
  if (navigator.clipboard) navigator.clipboard.writeText(input.value).catch(function(){});
  _toast('✓ Copied to clipboard');
};

window.regenerateKey = async function(id, name) {
  if (!confirm('Regenerate the API key for "'+name+'"? The old key will stop working immediately — any deployed gateway agent using it will need to be updated.')) return;
  try {
    var result = await _post('/api/v1/lab/data-sources/'+id+'/regenerate-key', {});
    await loadCurrentProject();
    renderOnboarding();
    showApiKeyReveal(name, result.apiKey, id);
  } catch(e) { alert('Could not regenerate key: '+e.message); }
};

}
window.promoteModel = async function(id) {
  try { await _patch('/api/v1/lab/models/'+id, { status:'PRODUCTION' }); await loadCurrentProject(); renderModels(); _toast('✓ Promoted to production'); }
  catch(e) { alert('Could not promote model: '+e.message); }
};
window.deployModel = async function(id) {
  var pillar = CURRENT_PROJECT ? CURRENT_PROJECT.pillar : null;
  if (pillar === 'PROCESS_OPTIMIZATION') { openGoldenBatchDeployModal(id); return; }
  if (pillar === 'SUPPLY_CHAIN') { openDemandForecastDeployModal(id); return; }
  try { await _patch('/api/v1/lab/models/'+id, { deployedToPilot:true }); await loadCurrentProject(); renderModels(); _toast('✓ Deployed to pilot'); }
  catch(e) { alert('Could not deploy model: '+e.message); }
};

// Process Optimization doesn't have a continuous target — deploying
// means attaching the specific parameter combination this model
// actually produced, so it has to be entered here rather than
// deploying blind. Every field is optional (a recommendation with no
// numbers yet is still a valid PENDING_TRIAL record, just an
// incomplete one), matching the honest "don't fabricate what the
// model hasn't produced" principle used throughout the backend.
window.openGoldenBatchDeployModal = function(modelId) {
  openModal('Deploy Golden Batch Recommendation',
    _field('Part Number (optional)','partNumber','text', null, null, false, 'e.g. TC-4471-B') +
    _field('Spindle Speed (RPM)','spindleSpeedRpm','number', null, null, false) +
    _field('Feed Rate (mm/rev)','feedRateMmRev','number', null, null, false) +
    _field('Coolant Pressure (PSI)','coolantPsi','number', null, null, false) +
    _field('Predicted Scrap Rate Change (%)','scrapRateDeltaPct','number', null, null, false, 'negative = improvement, e.g. -0.6') +
    _field('Predicted Cycle Time Change (%)','cycleTimeDeltaPct','number', null, null, false, 'negative = faster, e.g. -3.2'),
    async function(payload) {
      var recommendedParams = {};
      if (payload.spindleSpeedRpm) recommendedParams.spindleSpeedRpm = Number(payload.spindleSpeedRpm);
      if (payload.feedRateMmRev) recommendedParams.feedRateMmRev = Number(payload.feedRateMmRev);
      if (payload.coolantPsi) recommendedParams.coolantPsi = Number(payload.coolantPsi);
      var predictedImprovement = {};
      if (payload.scrapRateDeltaPct) predictedImprovement.scrapRateDeltaPct = Number(payload.scrapRateDeltaPct);
      if (payload.cycleTimeDeltaPct) predictedImprovement.cycleTimeDeltaPct = Number(payload.cycleTimeDeltaPct);
      await _patch('/api/v1/lab/models/'+modelId, {
        deployedToPilot: true, partNumber: payload.partNumber || undefined,
        recommendedParams: Object.keys(recommendedParams).length ? recommendedParams : undefined,
        predictedImprovement: Object.keys(predictedImprovement).length ? predictedImprovement : undefined,
      });
      await loadCurrentProject();
      renderModels();
    }
  );
};

// Supply Chain has no natural per-project bridge to a specific
// inventory item the way Vision/PM/Process Opt link through a data
// source — a supplier data feed doesn't map to one item — so which
// items this forecast applies to has to be stated explicitly here.
window.openDemandForecastDeployModal = function(modelId) {
  openModal('Deploy Demand Forecast Recommendation',
    _field('Inventory Item Part Numbers (comma-separated)','partNumbers','text', null, null, true, 'e.g. RM-2201, RM-2205') +
    _field('Recommended Reorder Point','recommendedReorderPoint','number', null, null, false) +
    _field('Recommended Safety Stock','recommendedSafetyStock','number', null, null, false) +
    _field('Avg Daily Demand (basis)','avgDailyDemand','number', null, null, false) +
    _field('Lead Time Used (days, basis)','leadTimeDaysUsed','number', null, null, false),
    async function(payload) {
      var partNumbers = (payload.partNumbers || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var itemsRes = await fetch('/api/v1/inventory?partNumbers=' + encodeURIComponent(partNumbers.join(',')), { credentials:'same-origin' });
      var items = itemsRes.ok ? (await itemsRes.json()).data : [];
      if (!items.length) throw new Error('No matching inventory items found for those part numbers');
      var forecastBasis = {};
      if (payload.avgDailyDemand) forecastBasis.avgDailyDemand = Number(payload.avgDailyDemand);
      if (payload.leadTimeDaysUsed) forecastBasis.leadTimeDaysUsed = Number(payload.leadTimeDaysUsed);
      await _patch('/api/v1/lab/models/'+modelId, {
        deployedToPilot: true,
        inventoryItemIds: items.map(function(i){ return i.id; }),
        recommendedReorderPoint: payload.recommendedReorderPoint || undefined,
        recommendedSafetyStock: payload.recommendedSafetyStock || undefined,
        forecastBasis: Object.keys(forecastBasis).length ? forecastBasis : undefined,
      });
      await loadCurrentProject();
      renderModels();
    }
  );
};

window.openAddModel = function() {
  openModal('Register Model',
    _field('Name','name','text') +
    _field('Type','type','select',['CLASSICAL_ML','TIME_SERIES','VISION','LLM'], MODELTYPE_LABELS),
    async function(payload){
      await _post('/api/v1/lab/projects/'+CURRENT_PROJECT.id+'/models', payload);
      await loadCurrentProject();
      renderModels();
    }
  );
};

// ── All Projects (cross-pilot view) ─────────────────────────
function renderAllProjects() {
  var el = _mainEl();
  if (!PROJECTS.length) { el.innerHTML = _noProjectState(); return; }
  el.innerHTML =
    '<div class="pt">Every Pilot\'s Lab</div>' +
    '<div class="ps">CorverxisLab is the shared build environment behind all four pilot studies — one project per pillar.</div>' +
    '<div class="module-grid">' +
      PROJECTS.map(function(p){
        var col = PILLAR_COLORS[p.pillar];
        var currentIdx = PHASE_ORDER.indexOf(p.phase);
        var pct = Math.round(((currentIdx+1)/PHASE_ORDER.length)*100);
        return '<div class="card" style="cursor:pointer" onclick="onProjectChange(\''+p.id+'\');document.getElementById(\'project-select\').value=\''+p.id+'\';showTab(\'overview\')">' +
          '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:'+col+'22;color:'+col+'">'+PILLAR_LABELS[p.pillar]+'</span>' +
          '<div class="ct" style="margin-top:8px">'+p.title+'</div>' +
          '<div style="font-size:10.5px;color:var(--muted);margin-bottom:10px">'+PHASE_LABELS[p.phase]+' · '+(p._count?p._count.dataSources+' sources, '+p._count.pipelines+' pipelines, '+p._count.models+' models':'')+'</div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+col+'"></div></div>' +
        '</div>';
      }).join('') +
    '</div>';
}

// ── Org Settings: Active Verticals ──────────────────────────
async function renderOrgSettings() {
  var el = _mainEl();
  el.innerHTML = '<div class="pt">Active Verticals</div>' +
    '<div class="ps">Which of the 18 SensorModel verticals this org actually operates in. This scopes the catalog picker in Site Onboarding and what gets seeded by default — a client using only Manufacturing sensors should not see Aerospace or Healthcare noise.</div>' +
    '<div id="verticals-list" class="card" style="padding:20px;text-align:center;color:var(--muted)">Loading...</div>';

  var allVerticals = [], activeSet = {};
  try {
    var [vRes, aRes] = await Promise.all([
      fetch('/api/v1/catalog/verticals', { credentials:'same-origin' }),
      fetch('/api/v1/org/verticals', { credentials:'same-origin' }),
    ]);
    allVerticals = vRes.ok ? (await vRes.json()).data : [];
    var active = aRes.ok ? (await aRes.json()).data.activeVerticals : [];
    active.forEach(function(v){ activeSet[v] = true; });
  } catch(e) {
    document.getElementById('verticals-list').innerHTML = 'Could not load verticals.';
    return;
  }

  if (!allVerticals.length) {
    document.getElementById('verticals-list').innerHTML =
      'Catalog is empty. <button class="btn btn-secondary" onclick="seedCatalogAndReload()">Load SensorModel Catalog Defaults</button>';
    return;
  }

  document.getElementById('verticals-list').outerHTML =
    '<div class="module-grid" id="verticals-list">' +
    allVerticals.map(function(v) {
      var isActive = !!activeSet[v.vertical];
      return '<div class="card" style="margin:0;cursor:pointer;border-color:' + (isActive ? 'rgba(0,194,224,.4)' : 'var(--border)') + '" onclick="toggleVertical(this,' + JSON.stringify(v.vertical) + ')" data-vertical="' + v.vertical.replace(/"/g,'&quot;') + '" data-active="' + isActive + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<div style="font-size:12.5px;font-weight:700;color:var(--text)">' + v.vertical + '</div>' +
          '<div class="vertical-check" style="width:16px;height:16px;border-radius:4px;border:2px solid ' + (isActive ? '#00c2e0' : 'var(--muted)') + ';background:' + (isActive ? '#00c2e0' : 'transparent') + '"></div>' +
        '</div>' +
        '<div style="font-size:10.5px;color:var(--muted);margin-top:4px">' + v.sensorCount + ' sensor definition(s) in catalog</div>' +
      '</div>';
    }).join('') +
    '</div>' +
    '<div style="margin-top:16px"><button class="btn btn-primary" onclick="saveActiveVerticals()">Save Active Verticals</button></div>';
}

window.toggleVertical = function(cardEl, vertical) {
  var isActive = cardEl.dataset.active === 'true';
  var newActive = !isActive;
  cardEl.dataset.active = newActive;
  cardEl.style.borderColor = newActive ? 'rgba(0,194,224,.4)' : 'var(--border)';
  var check = cardEl.querySelector('.vertical-check');
  check.style.borderColor = newActive ? '#00c2e0' : 'var(--muted)';
  check.style.background = newActive ? '#00c2e0' : 'transparent';
};

window.saveActiveVerticals = async function() {
  var cards = document.querySelectorAll('#verticals-list [data-vertical]');
  var activeVerticals = [];
  cards.forEach(function(c) { if (c.dataset.active === 'true') activeVerticals.push(c.dataset.vertical); });
  try {
    await fetch('/api/v1/org/verticals', {
      method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ activeVerticals: activeVerticals }),
    });
    _toast('\u2713 Saved ' + activeVerticals.length + ' active vertical(s)');
  } catch(e) { alert('Could not save: ' + e.message); }
};

window.seedCatalogAndReload = async function() {
  try {
    await _post('/api/v1/catalog/seed-defaults', {});
    renderOrgSettings();
  } catch(e) { alert('Could not seed catalog: ' + e.message); }
};

// ── Shared modal + form helpers ─────────────────────────────
function _field(label, name, type, options, labelMap, required, placeholder) {
  if (required === undefined) required = true;
  var attrs = 'name="'+name+'" '+(required?'required':'');
  var input;
  if (type === 'select') {
    input = '<select '+attrs+'>' + (options||[]).map(function(o){
      var lbl = labelMap ? (labelMap[o]||o) : o;
      return '<option value="'+o+'">'+lbl+'</option>';
    }).join('') + '</select>';
  } else if (type === 'textarea') {
    input = '<textarea '+attrs+' rows="3"></textarea>';
  } else {
    input = '<input type="'+type+'" '+attrs+(placeholder?' placeholder="'+placeholder+'"':'')+'>';
  }
  return '<div class="field"><label>'+label+'</label>'+input+'</div>';
}
function openModal(title, bodyHtml, onSubmit, opts) {
  opts = opts || {};
  var existing = document.getElementById('modal-overlay');
  if (existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal"'+(opts.wide ? ' style="max-width:560px"' : '')+'>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
        '<div style="font-size:14px;font-weight:700;color:var(--text)">'+title+'</div>' +
        '<button onclick="document.getElementById(\'modal-overlay\').remove()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button>' +
      '</div>' +
      '<form id="modal-form">' + bodyHtml +
        '<div id="modal-error" style="display:none;color:#ef4444;font-size:11px;margin-bottom:10px"></div>' +
        '<button type="submit" class="btn btn-primary" style="width:100%">Save</button>' +
      '</form>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if (e.target===overlay) overlay.remove(); });
  // Optional hook for wiring up dynamic behavior (cascading dropdowns,
  // conditional field visibility) after the form is actually in the DOM.
  if (opts.onMount) opts.onMount(document.getElementById('modal-form'));
  document.getElementById('modal-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = e.target.querySelector('button[type=submit]');
    var errEl = document.getElementById('modal-error');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Saving…';
    var fd = new FormData(e.target);
    var payload = {};
    fd.forEach(function(v,k){ if (v!=='') payload[k]=v; });
    try { await onSubmit(payload); overlay.remove(); _toast('✓ Saved'); }
    catch(err) { errEl.textContent = err.message||'Something went wrong.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Save'; }
  });
}
function _toast(msg) {
  var existing = document.getElementById('toast');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.id = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateY(0)'; });
  setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(function(){ t.remove(); }, 300); }, 2600);
}
async function _post(url, body) {
  var r = await fetch(url, { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  var json = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(json.error || ('Request failed ('+r.status+')'));
  return json;
}
async function _patch(url, body) {
  var r = await fetch(url, { method:'PATCH', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  var json = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(json.error || ('Request failed ('+r.status+')'));
  return json;
}

boot();
setInterval(async function(){
  if (document.getElementById('modal-overlay')) return; // don't yank focus mid-form
  await loadProjects();
  renderProjectSelect();
  await loadCurrentProject();
  showTab(ACTIVE_TAB);
}, 30000);
</script>
