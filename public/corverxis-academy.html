      {
        title: 'OSHA Basics: Your Rights and Responsibilities',
        html: `<h2>What OSHA actually covers</h2><p>The Occupational Safety and Health Administration sets and enforces workplace safety standards. As an employee, you have specific rights under OSHA: the right to a workplace free of recognized hazards, the right to request safety information, and the right to report a hazard or refuse genuinely dangerous work without retaliation.</p><h2>Your responsibilities</h2><p>Rights come with responsibilities: following established safety procedures, using required personal protective equipment (PPE), and reporting hazards or incidents promptly rather than assuming someone else will.</p><h2>Reporting without fear</h2><p>Retaliation against someone for reporting a genuine safety concern is illegal and, separately from the legal requirement, directly undermines the psychological safety culture covered in People Management Essentials — a team that's afraid to report hazards is a team where hazards go unaddressed.</p><div class="callout">If you ever feel a safety concern you've raised isn't being taken seriously, you have the right to escalate beyond your immediate supervisor — to People &amp; Talent, or externally to OSHA directly if needed.</div>`

      {

        html: `<h2>Why LOTO exists</h2><p>Lockout/Tagout procedures prevent machines from unexpectedly starting up or releasing stored energy while someone is servicing or maintaining them — this is one of the most consequential safety procedures in manufacturing precisely because the failure mode is catastrophic, not minor.</p><h2>The core LOTO steps</h2><ul><li>Notify affected employees before beginning</li><li>Shut down the equipment using normal procedures</li><li>Isolate all energy sources — electrical, hydraulic, pneumatic, mechanical</li><li>Apply your own lock and tag — never rely solely on someone else's</li><li>Verify zero energy state before beginning work — test that the machine genuinely cannot start</li><li>Remove locks only when work is fully complete and it's safe to restore power</li></ul><h2>Multiple energy sources</h2><p>A machine can have more than one energy source — electrical AND stored hydraulic pressure, for example. Isolating only one is not sufficient; every energy source capable of causing harm must be locked out.</p><div class="callout">Never remove someone else's lock, even if you believe the work is done. LOTO only works if everyone can trust that a lock on a machine means exactly what it's supposed to mean, without exception.</div>`
      },
      {
        title: 'Machine Guarding & Point-of-Operation Safety',
        html: `<h2>What machine guards protect against</h2><p>Machine guards physically prevent contact with moving parts, rotating components, or the point where material is actually being cut, formed, or processed — the point of operation, where most serious machine-related injuries occur.</p><h2>Never defeat a guard</h2><p>A guard that's been removed, propped open, or bypassed "just to speed things up" removes exactly the protection it exists to provide — and this is one of the most common root causes in serious manufacturing injuries. If a guard is making a task genuinely difficult, that's a signal to report it for engineering review, not to defeat it yourself.</p><h2>Reporting a damaged or missing guard</h2><p>Treat a missing or damaged guard with the same urgency as any other serious hazard — report it immediately and avoid operating the equipment until it's restored, rather than "just being extra careful" as a substitute.</p><div class="callout">If defeating a guard would genuinely make your job faster or easier, that's exactly the situation the guard is designed to protect against — the shortcut and the hazard are the same thing.</div>`
      },
      {
        title: 'Hazard Communication & Chemical Safety',
        html: `<h2>Safety Data Sheets (SDS)</h2><p>Every hazardous chemical used at Corverxis has an associated Safety Data Sheet describing its hazards, safe handling procedures, and emergency response steps. Knowing where to find the SDS for a chemical you work with — and actually reading it — is a basic right and responsibility under Hazard Communication requirements.</p><h2>Labels aren't optional decoration</h2><p>Chemical container labels are a required, standardized part of the hazard communication system — the pictograms and signal words (Danger, Warning) carry specific regulatory meaning, not just general caution.</p><h2>Proper storage and handling</h2><p>Incompatible chemicals (e.g. certain acids and bases, or oxidizers and flammables) must be stored separately — mixing storage isn't just disorganized, it can create a genuine hazard even without any spill or accident.</p><div class="callout">If you're ever unsure whether two chemicals are safe to store or use near each other, check the SDS or ask — don't assume based on how they look or smell.</div>`
      },
      {
        title: 'Incident Reporting & Near-Miss Culture',
        html: `<h2>Why near-misses matter as much as actual incidents</h2><p>A near-miss — something that almost caused an injury but didn't — is a free warning. The same conditions that produced a near-miss today can produce a real injury tomorrow if nothing changes. Organizations with strong safety cultures actively encourage near-miss reporting rather than only tracking actual injuries.</p><h2>Reporting promptly, even for something minor</h2><p>Report incidents and near-misses as soon as possible after they happen — details fade quickly, and prompt reporting also means faster action if there's a genuine hazard still present.</p><h2>What good reporting culture looks like</h2><p>The goal of incident reporting is understanding and fixing the underlying cause, not assigning blame. A team that fears blame for reporting will simply stop reporting — which doesn't make the hazard disappear, it just makes it invisible until someone gets hurt.</p><div class="callout">Every near-miss report you file is data that can prevent a real injury — either yours, or a coworker's, down the line. Treat it as seriously as you'd want a coworker to treat a hazard that could affect you.</div>`
      }
    ],
    quiz: [
      { q: 'What right does OSHA give employees regarding hazard reporting?', opts: ['No specific protections exist', 'The right to report a hazard or refuse genuinely dangerous work without retaliation', 'Only supervisors can report hazards'], correct: 1 },

      { q: 'What should you do if a machine guard is making a task difficult?', opts: ['Remove or bypass the guard to work faster', 'Report it for engineering review rather than defeating it yourself', 'Ignore the issue and work around it silently'], correct: 1 },
      { q: 'What is the purpose of a Safety Data Sheet (SDS)?', opts: ['To track chemical purchase costs', 'To describe a chemical\'s hazards, safe handling, and emergency response steps', 'To record employee attendance'], correct: 1 },
      { q: 'Why should near-misses be reported, not just actual injuries?', opts: ['Near-misses don\'t provide useful information', 'A near-miss is a free warning that the same conditions could cause a real injury next time', 'Only OSHA cares about near-miss data, not Corverxis'], correct: 1 },
    ],
  },
  {

    lessons: [
      {
        title: 'Why Intuition Alone Isn\'t Enough Anymore',
        html: `<h2>Experience is valuable — and has real limits</h2><p>Experienced operators and managers develop genuinely valuable intuition over years on the floor. But intuition has known blind spots: it's shaped disproportionately by memorable events rather than the full picture, and it doesn't scale — one person's pattern-matching, however good, can't process what a dashboard drawing on thousands of data points across every shift can surface.</p><h2>The right relationship between intuition and data</h2><p>The goal isn't replacing intuition with data — it's using data to check intuition, and using intuition to sanity-check data. A dashboard number that looks wrong might genuinely be a data error; someone with floor experience is often the fastest way to catch that.</p><div class="callout">The best-performing teams don't choose between gut feeling and data — they use each to validate the other, and treat a disagreement between the two as worth investigating rather than defaulting to whichever one is more comfortable.</div>`

      {
        title: 'Reading a Dashboard Critically',
        html: `<h2>Questions to ask before trusting a number</h2><ul><li>What time period does this cover, and is that the right period for the decision I'm making?</li><li>Is this a raw count or a rate — and does that distinction matter here? (10 defects out of 100 parts is very different from 10 out of 10,000)</li><li>What's excluded from this number? A "pass rate" that excludes parts sent to rework can look better than reality.</li></ul><h2>Averages hide a lot</h2><p>An average completion time of 3 days might be hiding a distribution where most requests take 1 day and a few outliers take 3 weeks — very different operational realities that the single average number doesn't reveal.</p><div class="callout">Before making a decision based on a dashboard number, spend thirty seconds asking what it might be hiding. This habit alone prevents a large share of bad data-driven decisions.</div>`

        html: `<h2>Two things moving together doesn't mean one causes the other</h2><p>If scrap rate and ambient temperature both rise in summer, that could mean heat genuinely affects the process — or it could mean summer also brings a seasonal staffing change, different material lots, or higher production volume, any of which could be the real cause.</p><h2>A concrete manufacturing example</h2><p>A line that runs faster (higher output) might also show higher scrap — it's tempting to conclude speed causes scrap. But if that line also happens to run the hardest-to-machine part numbers when scheduling allows extra capacity, the real driver might be part difficulty, not speed at all.</p><h2>What to do about it</h2><p>When you spot a correlation, ask what else changed at the same time before assuming a causal link. Where possible, test the suspected cause directly and in isolation — this is exactly the controlled-trial thinking covered in Golden Batch process optimization.</p><div class="callout">"Correlation isn't causation" isn't just an academic phrase — acting on a false causal assumption can lead you to fix the wrong thing entirely, while the real cause keeps operating unaddressed.</div>`

      {

var state = { courseIdx: 0, lessonIdx: -1, quizAnswers: {}, quizSubmitted: false, trainingId: null, employeeName: null };
var completedLessons = {}; // "courseIdx-lessonIdx" -> true

function initFromUrl(){
  var params = new URLSearchParams(location.search);
  state.trainingId = params.get('trainingId');
  var courseSlug = params.get('course');
  if (courseSlug) {
    var idx = COURSES.findIndex(function(c){ return c.slug === courseSlug; });
    if (idx >= 0) state.courseIdx = idx;
  }
}

function renderCourseList(){
  var el = document.getElementById('course-list');
  el.innerHTML = COURSES.map(function(c, i){
    var col = PILLAR_COLORS[c.pillar];
    return '<div class="course-nav-item'+(i===state.courseIdx?' active':'')+'" onclick="selectCourse('+i+')">' +
      '<div class="course-nav-title">'+c.title+'</div>' +
      '<div class="course-nav-meta"><span style="color:'+col+'">'+PILLAR_LABELS[c.pillar]+'</span> · '+c.duration+' · '+c.level+'</div>' +
    '</div>';
  }).join('');
}

window.selectCourse = function(i){
  state.courseIdx = i;
  state.lessonIdx = -1; // -1 = overview
  state.quizSubmitted = false;
  state.quizAnswers = {};
  renderCourseList();
  renderView();
};

window.selectLesson = function(i){
  state.lessonIdx = i;
  renderView();
  // First lesson view on this course marks training IN_PROGRESS
  if (state.trainingId) markTrainingStatus('IN_PROGRESS');
};

function renderView(){
  var course = COURSES[state.courseIdx];
  var col = PILLAR_COLORS[course.pillar];
  var el = document.getElementById('course-view');

  if (state.lessonIdx === -1) {
    // Overview
    el.innerHTML =
      '<div class="hero">' +
        '<span class="hero-pillar" style="background:'+col+'22;color:'+col+'">'+PILLAR_LABELS[course.pillar]+'</span>' +
        '<div class="hero-title">'+course.title+'</div>' +
        '<div style="font-size:13px;color:var(--text2);margin-bottom:10px">'+course.subtitle+'</div>' +
        '<div class="hero-meta"><span>⏱ '+course.duration+'</span><span>'+course.level+'</span><span>'+course.lessons.length+' lessons + quiz</span>'+(course.isRequired?'<span style="color:#ef4444;font-weight:700">● Required</span>':'<span style="color:#6b7280">○ Elective</span>')+'</div>' +
      '</div>' +
      '<div class="content">' +
        '<h2>What you\'ll cover</h2><ul>' +
        course.lessons.map(function(l,i){ return '<li>'+l.title+'</li>'; }).join('') +
        '</ul>' +
      '</div>' +
      '<div class="nav-buttons"><span></span><button class="btn btn-primary" onclick="selectLesson(0)">Start Course →</button></div>';
    return;
  }

  if (state.lessonIdx === course.lessons.length) {
    renderQuiz();
    return;
  }

  var lesson = course.lessons[state.lessonIdx];
  var pct = Math.round(((state.lessonIdx) / (course.lessons.length+1)) * 100);
  el.innerHTML =
    '<div class="hero" style="padding-bottom:20px">' +
      '<span class="hero-pillar" style="background:'+col+'22;color:'+col+'">'+PILLAR_LABELS[course.pillar]+'</span>' +
      '<div class="hero-title" style="font-size:19px">'+lesson.title+'</div>' +
      '<div class="progress-bar" style="margin-top:14px"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
    '</div>' +
    '<div class="content">'+lesson.html+'</div>' +
    '<div class="nav-buttons">' +
      (state.lessonIdx>0 ? '<button class="btn btn-secondary" onclick="selectLesson('+(state.lessonIdx-1)+')">← Previous</button>' : '<span></span>') +
      '<button class="btn btn-primary" onclick="completeLesson()">'+(state.lessonIdx===course.lessons.length-1?'Continue to Quiz →':'Next Lesson →')+'</button>' +
    '</div>';

  // Render sidebar lesson sub-list under active course
  renderLessonSidebar();
}

function completeLesson(){
  completedLessons[state.courseIdx+'-'+state.lessonIdx] = true;
  var course = COURSES[state.courseIdx];
  selectLesson(state.lessonIdx+1);
}

function renderLessonSidebar(){
  // Inject a lesson sub-list into the active course-nav-item
  var items = document.querySelectorAll('.course-nav-item');
  var activeItem = items[state.courseIdx];
  if (!activeItem) return;
  var existing = activeItem.querySelector('.lesson-sublist');
  if (existing) existing.remove();
  var course = COURSES[state.courseIdx];
  var sub = document.createElement('div');
  sub.className = 'lesson-sublist';
  sub.style.marginTop = '8px';
  sub.innerHTML = course.lessons.map(function(l,i){
    var done = completedLessons[state.courseIdx+'-'+i];
    var active = i === state.lessonIdx;
    return '<div class="lesson-item'+(active?' active':'')+'" onclick="event.stopPropagation();selectLesson('+i+')">' +
      '<span class="lesson-check'+(done?' done':'')+'">'+(done?'✓':'')+'</span>' + l.title +
    '</div>';
  }).join('');
  activeItem.appendChild(sub);
}

function renderQuiz(){
  var course = COURSES[state.courseIdx];
  var col = PILLAR_COLORS[course.pillar];
  var el = document.getElementById('course-view');

  if (state.quizSubmitted) {
    var score = course.quiz.filter(function(q,i){ return state.quizAnswers[i] === q.correct; }).length;
    var passed = score === course.quiz.length;
    el.innerHTML =
      '<div class="complete-banner">' +
        '<div style="font-size:32px;margin-bottom:8px">'+(passed?'🎓':'📋')+'</div>' +
        '<div style="font-size:18px;font-weight:800;margin-bottom:6px">'+(passed?'Course Complete!':'Almost there — '+score+'/'+course.quiz.length+' correct')+'</div>' +
        '<div style="font-size:12.5px;color:var(--text2);margin-bottom:16px">'+(passed?course.title+' has been marked complete in CorverxisHRIM.':'Review the lessons and try the quiz again.')+'</div>' +
        (passed
          ? '<button class="btn btn-primary" onclick="selectCourse((('+state.courseIdx+'+1)%'+COURSES.length+'))">Next Course →</button>'
          : '<button class="btn btn-primary" onclick="retryQuiz()">Retry Quiz</button>') +
      '</div>';
    if (passed && state.trainingId) markTrainingStatus('COMPLETED');
    return;
  }

  el.innerHTML =
    '<div class="hero" style="padding-bottom:20px">' +
      '<span class="hero-pillar" style="background:'+col+'22;color:'+col+'">'+PILLAR_LABELS[course.pillar]+'</span>' +
      '<div class="hero-title" style="font-size:19px">Knowledge Check</div>' +
      '<div style="font-size:12.5px;color:var(--text2)">Answer all questions to mark this course complete.</div>' +
    '</div>' +
    '<div class="content">' +
      course.quiz.map(function(q,qi){
        return '<div class="quiz-q"><div class="quiz-q-text">'+(qi+1)+'. '+q.q+'</div>' +
          q.opts.map(function(o,oi){
            var sel = state.quizAnswers[qi]===oi;
            return '<div class="quiz-opt'+(sel?' selected':'')+'" onclick="selectAnswer('+qi+','+oi+')">'+o+'</div>';
          }).join('') +
        '</div>';
      }).join('') +
    '</div>' +
    '<div class="nav-buttons"><button class="btn btn-secondary" onclick="selectLesson('+(course.lessons.length-1)+')">← Back to lessons</button>' +
      '<button class="btn btn-primary" onclick="submitQuiz()">Submit Quiz</button></div>';
}

window.selectAnswer = function(qi, oi){
  state.quizAnswers[qi] = oi;
  renderQuiz();
};
window.submitQuiz = function(){
  var course = COURSES[state.courseIdx];
  if (Object.keys(state.quizAnswers).length < course.quiz.length) {
    alert('Please answer all questions before submitting.');
    return;
  }
  state.quizSubmitted = true;
  renderQuiz();
};
window.retryQuiz = function(){
  state.quizSubmitted = false;
  state.quizAnswers = {};
  renderQuiz();
};

async function markTrainingStatus(status){
  if (!state.trainingId) return;
  try {
    await fetch('/api/v1/hrim/trainings/'+state.trainingId, {
      method: 'PATCH', credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ status: status }),
    });
  } catch(e) { /* non-fatal — the tracker in Change Management will just stay unsynced */ }
}

async function loadEmployeeBanner(){
  if (!state.trainingId) return;
  try {
    var r = await fetch('/api/v1/hrim/trainings/'+state.trainingId, { credentials:'same-origin' });
    if (!r.ok) return;
    var t = (await r.json()).data;
    if (!t) return;
    state.employeeName = t.employee ? (t.employee.firstName+' '+t.employee.lastName) : null;
    var banner = document.getElementById('employee-banner');
    banner.style.display = 'flex';
    banner.innerHTML = '<span>Training record for <strong style="color:var(--text)">'+(state.employeeName||'—')+'</strong> · '+t.courseName+'</span>' +
      '<span class="badge" style="background:rgba(0,194,224,.15);color:#00c2e0">'+t.status.replace('_',' ')+'</span>';
  } catch(e) {}
}

initFromUrl();
renderCourseList();
renderView();
loadEmployeeBanner();
</script>
</body>
</html>
