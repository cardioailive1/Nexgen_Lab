<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorverxisHRIM | Human Capital Intelligence Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0a1628;--navy2:#0d1f3c;--navy3:#112645;--navy4:#163050;
  --ocean:#00c2e0;--ocean2:#0096b5;--ocean3:#00deff;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --text:#e2e8f0;--text2:#9ca3af;--muted:#6b7280;--border:rgba(255,255,255,0.08);
}
body{background:var(--navy);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:13px;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.4);}50%{opacity:0.7;box-shadow:0 0 0 4px rgba(34,197,94,0);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* HEADER */
.header{background:var(--navy2);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:100;}
.logo{display:flex;align-items:center;gap:8px;}
.logo-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#00c2e0);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}
.logo-name{font-weight:800;font-size:15px;letter-spacing:-0.3px;}
.logo-sub{font-size:10px;color:var(--ocean);letter-spacing:0.12em;text-transform:uppercase;}
.hdr-divider{width:1px;height:24px;background:var(--border);}
.hdr-badge{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(124,58,237,0.14);color:#a78bfa;border:1px solid rgba(124,58,237,0.25);}
.hdr-stat{font-size:11px;color:var(--muted);}
.hdr-stat span{color:var(--text);font-weight:700;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--green);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.hdr-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#00c2e0,#0096b5);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#0a1628;}

/* TOOLBAR / TABS */
.toolbar{background:var(--navy3);border-bottom:1px solid var(--border);padding:0 12px;height:38px;display:flex;align-items:center;gap:2px;flex-shrink:0;overflow-x:auto;}
.tbtn{padding:5px 11px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all 0.15s;white-space:nowrap;}
.tbtn:hover{background:rgba(255,255,255,0.06);color:var(--text);}
.tbtn.active{background:rgba(124,58,237,0.16);color:#a78bfa;}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:18px 22px;}
.page{display:none;animation:fadeIn 0.25s ease;}
.page.active{display:block;}
.pt{font-size:19px;font-weight:800;color:var(--text);margin-bottom:2px;}
.ps{font-size:11.5px;color:var(--muted);margin-bottom:16px;}

/* KPI GRID */
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px;}
.kpi{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:all 0.2s;}
.kpi-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.kpi-v{font-size:22px;font-weight:800;line-height:1;margin-bottom:4px;}
.kpi-s{font-size:10.5px;color:var(--text2);}

/* CARDS */
.card{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:14px;}
.ct{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:10px;}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:8px 10px;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text2);}
tr:hover td{background:rgba(255,255,255,0.02);}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;}
.badge.ok{background:rgba(34,197,94,0.14);color:var(--green);}
.badge.warn{background:rgba(245,158,11,0.14);color:var(--amber);}
.badge.crit{background:rgba(239,68,68,0.14);color:var(--red);}
.badge.info{background:rgba(0,194,224,0.14);color:var(--ocean);}
.badge.purp{background:rgba(139,92,246,0.14);color:var(--purple);}

/* SUB TABS */
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.stab{padding:6px 13px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11.5px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.stab:hover{border-color:rgba(124,58,237,0.35);color:var(--text);}
.stab.active{background:rgba(124,58,237,0.14);border-color:rgba(124,58,237,0.4);color:#a78bfa;}
.panel{display:none;}
.panel.active{display:block;animation:fadeIn 0.2s ease;}

/* FORM */
input,select,textarea{background:var(--navy3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ocean);}

/* MODAL / DRAWER */
.drawer{display:none;position:fixed;right:0;top:0;width:380px;height:100vh;background:var(--navy2);border-left:1px solid rgba(124,58,237,0.25);z-index:1000;overflow-y:auto;padding:20px;box-shadow:-8px 0 32px rgba(0,0,0,.5);}
.drawer-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
.progress-bar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">HR</div>
    <div>
      <div class="logo-name">CorverxisHRIM</div>
      <div class="logo-sub">Human Capital Intelligence</div>
    </div>
  </div>
  <div class="hdr-divider"></div>

    <div class="live-pill"><div class="live-dot"></div>LIVE</div>

<div class="toolbar" id="hrim-toolbar">
  <button class="tbtn active" id="ti-dash" onclick="hrimNav('dash')">Dashboard</button>
  <button class="tbtn" id="ti-people" onclick="hrimNav('people')">People</button>
  <button class="tbtn" id="ti-org" onclick="hrimNav('org')">Org Chart</button>
  <button class="tbtn" id="ti-time" onclick="hrimNav('time')">Time &amp; Attendance</button>

<div class="main" id="hrim-main">

<!-- Employee Detail Drawer -->
<div class="drawer" id="emp-drawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="font-size:14px;font-weight:700" id="emp-drawer-title">Employee</div>
    <button class="drawer-close" onclick="document.getElementById('emp-drawer').style.display='none'">×</button>
  </div>
  <div id="emp-drawer-content"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CorverxisHRIM — DATA LAYER
// ══════════════════════════════════════════════════════════════

var DEPARTMENTS = ['Manufacturing Ops','Quality Engineering','Supply Chain','R&D / AI Engineering','Finance','Sales & Customer Success','IT / Platform','People & Talent','Executive'];
var LOCATIONS   = ['Detroit MI (HQ)','Toledo OH (Plant 1)','Querétaro MX (Plant 2)','Stuttgart DE (Plant 3)','Pune IN (R&D Hub)','Austin TX (Cloud Eng)','Remote — US','Remote — EU','Remote — APAC'];
var FIRST = ['James','Maria','Wei','Priya','Carlos','Emma','David','Fatima','Lucas','Sofia','Michael','Aisha','Tom','Elena','Raj','Grace','Daniel','Yuki','Omar','Nina','Kevin','Amara','Peter','Ingrid','Sam','Zara','Alex','Noor','Ben','Chidi'];
var LAST  = ['Rodriguez','Chen','Patel','Mueller','Nakamura','Silva','Kowalski','Osei','Novak','Andersson','Kim','Hassan','Bianchi','Larsson','Reyes','Voss','Adeyemi','Park','Costa','Ivanov'];

function _dateBack(years){
  var d = new Date();
  d.setDate(d.getDate() - Math.round(years*365));
  return d.toISOString().slice(0,10);
}
function _skillsFor(dept){
  var map = {
    'Manufacturing Ops':['Lean Six Sigma','SPC','5S','Kaizen'],
    'Quality Engineering':['IATF 16949','FMEA','PPAP','Minitab'],
    'Supply Chain':['SAP MM','Demand Planning','Negotiation'],
    'R&D / AI Engineering':['Python','PyTorch','LLM Fine-tuning','MLOps'],
    'Finance':['Excel Modeling','SAP FI','GAAP'],
    'Sales & Customer Success':['Salesforce','Negotiation','SPIN Selling'],
    'IT / Platform':['AWS','Kubernetes','Terraform'],
    'People & Talent':['Workday','ATS','Compensation Design'],
    'Executive':['Strategic Planning','P&L Ownership','M&A'],
  };
  return map[dept]||['Leadership','Communication'];
}

// No fabricated employees. EMPLOYEES stays empty until fetchHrimLive()
// populates it from the CorverxisONE backend. See HRIM_LIVE / _hrimEmptyState.
var EMPLOYEES = [];
var HEADCOUNT = 0;

// ══════════════════════════════════════════════════════════════
//  LIVE DATA LAYER — fetches from CorverxisONE backend when hosted.
//  Falls back to the synthetic generator above when offline/local
//  (same pattern used across CorverxisONE, Vision, SensorModel).
// ══════════════════════════════════════════════════════════════
var HRIM_LIVE = false; // becomes true once real API data has loaded
var HRIM_STATS = { openReqs:0, pendingLeave:0, upcomingReviews:0, newHires30d:0 };

function _hrimStatusToLabel(s){
  return { ACTIVE:'Active', ON_LEAVE:'On Leave', TERMINATED:'Terminated', PENDING_START:'Pending Start' }[s] || s;
}
function _hrimPerfLabel(rating){
  if (rating == null) return 'Meets';
  if (rating >= 4.4) return 'Exceeds';
  if (rating >= 2.8) return 'Meets';
  return 'Developing';
}

async function fetchHrimLive(){
  try {
    var [empRes, deptRes] = await Promise.all([
      fetch('/api/v1/hrim/employees', { credentials:'same-origin' }),
      fetch('/api/v1/hrim/departments', { credentials:'same-origin' }),
    ]);
    if (!empRes.ok || !deptRes.ok) throw new Error('HRIM API not available');
    var empJson  = await empRes.json();
    var deptJson = await deptRes.json();
    var apiEmployees = empJson.data || [];
    var apiDepts      = deptJson.data || [];
    // Note: zero employees is a valid state (fresh org) — not an error.

    // Rebuild DEPARTMENTS from live data (keeps filter dropdowns accurate)
    var liveDeptNames = apiDepts.map(function(d){ return d.name; });
    if (liveDeptNames.length) {
      DEPARTMENTS.length = 0;
      liveDeptNames.forEach(function(n){ DEPARTMENTS.push(n); });
    }
    var deptById = {};
    apiDepts.forEach(function(d){ deptById[d.id] = d.name; });

    // Transform API employee shape → the shape every hrimRender* fn expects
    var mapped = apiEmployees.map(function(e){
      var riskScore = e.attritionRiskScore != null ? e.attritionRiskScore/100 : 0.15;
      return {
        id: e.employeeCode || e.id,
        _dbId: e.id,
        name: e.firstName + ' ' + e.lastName,
        firstName: e.firstName, lastName: e.lastName,
        dept: deptById[e.departmentId] || (e.department ? e.department.name : 'Unassigned'),
        title: e.jobTitle,
        location: e.location || '—',
        manager: e.manager ? (e.manager.firstName + ' ' + e.manager.lastName) : null,
        tenure: +(((Date.now() - new Date(e.hireDate).getTime()) / (365.25*24*3600*1000))).toFixed(1),
        hireDate: (e.hireDate || '').slice(0,10),
        perf: _hrimPerfLabel(e.performanceRating),
        attritionRisk: riskScore,
        riskLabel: e.attritionRiskLabel || 'Low',
        salary: e.baseSalary || 0,
        status: _hrimStatusToLabel(e.status),
        email: e.email,
        avatarBg: ['#00c2e0','#8b5cf6','#22c55e','#f59e0b','#ef4444','#0096b5'][Math.abs((e.id||'').split('').reduce(function(a,c){return a+c.charCodeAt(0);},0)) % 6],
        ptoBalance: Math.round((e.ptoBalanceHours||0)/8), // hours → days
        skills: _skillsFor(deptById[e.departmentId] || 'Manufacturing Ops'),
        level: (deptById[e.departmentId]==='Executive') ? 'Executive' : (e.performanceRating>=4.4?'Senior':e.performanceRating>=3.0?'Mid':'Junior'),
      };
    });

    // Replace EMPLOYEES array contents in place (many closures reference this array by identity)
    EMPLOYEES.length = 0;
    mapped.forEach(function(e){ EMPLOYEES.push(e); });
    HEADCOUNT = EMPLOYEES.filter(function(e){return e.status==='Active';}).length;
    HRIM_LIVE = true;

    // Pull secondary stats used on the dashboard — real numbers, not placeholders
    try {
      var [reqRes, leaveRes] = await Promise.all([
        fetch('/api/v1/hrim/requisitions', { credentials:'same-origin' }),
        fetch('/api/v1/hrim/leave?status=PENDING', { credentials:'same-origin' }),
      ]);
      var reqJson   = reqRes.ok   ? await reqRes.json()   : { data: [] };
      var leaveJson = leaveRes.ok ? await leaveRes.json() : { data: [] };
      HRIM_STATS.openReqs     = (reqJson.data||[]).filter(function(r){return r.status==='OPEN';}).length;
      HRIM_STATS.pendingLeave = (leaveJson.data||[]).length;
      var now = Date.now();
      HRIM_STATS.newHires30d = EMPLOYEES.filter(function(e){
        return e.hireDate && (now - new Date(e.hireDate).getTime()) < 30*24*3600*1000;
      }).length;
    } catch(e2) { /* secondary stats are non-critical — dashboard shows 0s, not fake numbers */ }

    var liveEl = document.getElementById('hrim-live-badge');
    if (liveEl) { liveEl.textContent = 'LIVE DATA'; liveEl.style.color = '#22c55e'; }

    return true;
  } catch(e) {
    console.warn('HRIM live fetch failed:', e.message);
    var liveEl = document.getElementById('hrim-live-badge');
    if (liveEl) { liveEl.textContent = 'API UNAVAILABLE'; liveEl.style.color = '#ef4444'; }
    HRIM_LIVE = false;
    return false;
  }
}

// ══════════════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════════════
var HRIM_PAGES = ['dash','people','org','time','payroll','benefits','ats','perf','learn','comp','succ','analytics','compliance','assistant'];
var _hrimInit = {};

function hrimNav(id){
  document.querySelectorAll('.tbtn').forEach(function(b){ b.classList.toggle('active', b.id==='ti-'+id); });
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id==='hp-'+id); });
  var main = document.getElementById('hrim-main');
  var pageEl = document.getElementById('hp-'+id);
  if (!pageEl) {
    pageEl = document.createElement('div');
    pageEl.className = 'page active';
    pageEl.id = 'hp-'+id;
    main.appendChild(pageEl);
  } else {
    pageEl.classList.add('active');
  }
  // Always re-run the renderer so pages reflect current live data —
  // not just on first visit. Cheap: these are plain string builds.
  RENDERERS[id] && RENDERERS[id](pageEl);
}

function _fmtMoney(n){ return '$'+n.toLocaleString('en-US'); }
function _initials(name){ return name.split(' ').map(function(p){return p[0];}).join('').substring(0,2); }
function _riskColor(l){ return l==='High'?'var(--red)':l==='Medium'?'var(--amber)':'var(--green)'; }
function _perfColor(p){ return p==='Exceeds'?'var(--green)':p==='Meets'?'var(--ocean)':'var(--amber)'; }

// ══════════════════════════════════════════════════════════════
//  MANUAL DATA ENTRY — generic modal + concrete forms wired to
//  the live POST endpoints in src/routes/hrim.js
// ══════════════════════════════════════════════════════════════
function hrimOpenModal(title, bodyHtml, onSubmit, submitLabel){
  var existing = document.getElementById('hrim-modal-overlay');
  if (existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'hrim-modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(5,10,20,.72);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML =
    '<div style="background:#0d1f3c;border:1px solid rgba(0,194,224,.25);border-radius:12px;max-width:480px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
        '<div style="font-size:14px;font-weight:700;color:#e2e8f0">'+title+'</div>' +
        '<button onclick="document.getElementById(\'hrim-modal-overlay\').remove()" style="background:none;border:none;color:#6b7280;font-size:20px;cursor:pointer;line-height:1">×</button>' +
      '</div>' +
      '<form id="hrim-modal-form">' + bodyHtml +
        '<div id="hrim-modal-error" style="display:none;color:#ef4444;font-size:11px;margin-bottom:10px"></div>' +
        '<button type="submit" style="width:100%;padding:10px;background:#00c2e0;border:none;border-radius:7px;color:#0a1628;font-size:13px;font-weight:700;cursor:pointer">'+(submitLabel||'Submit')+'</button>' +
      '</form>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if (e.target===overlay) overlay.remove(); });
  document.getElementById('hrim-modal-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = e.target.querySelector('button[type=submit]');
    var errEl = document.getElementById('hrim-modal-error');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Saving…';
    var fd = new FormData(e.target);
    var payload = {};
    fd.forEach(function(v,k){ payload[k] = v; });
    try {
      await onSubmit(payload);
      overlay.remove();
    } catch(err) {
      errEl.textContent = err.message || 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = submitLabel||'Submit';
    }
  });
}

function _field(label, name, type, opts){
  opts = opts || {};
  var required = opts.required !== false;
  var attrs = 'name="'+name+'" '+(required?'required':'')+(opts.step?' step="'+opts.step+'"':'');
  var input;
  if (type==='select') {
    input = '<select '+attrs+' style="width:100%;padding:8px;background:#112645;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#e2e8f0;font-size:12px">' +
      (opts.placeholder?'<option value="">'+opts.placeholder+'</option>':'') +
      (opts.options||[]).map(function(o){ return '<option value="'+(o.value!==undefined?o.value:o)+'">'+(o.label||o)+'</option>'; }).join('') +
    '</select>';
  } else if (type==='textarea') {
    input = '<textarea '+attrs+' rows="3" style="width:100%;padding:8px;background:#112645;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#e2e8f0;font-size:12px;resize:vertical"></textarea>';
  } else {
    input = '<input type="'+type+'" '+attrs+' style="width:100%;padding:8px;background:#112645;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#e2e8f0;font-size:12px">';
  }
  return '<div style="margin-bottom:12px"><label style="display:block;font-size:11px;color:#9ca3af;margin-bottom:4px">'+label+'</label>'+input+'</div>';
}

async function _hrimPost(url, body){
  var r = await fetch(url, {
    method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  var json = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(json.error || json.message || ('Request failed ('+r.status+')'));
  return json;
}
async function _hrimPatch(url, body){
  var r = await fetch(url, {
    method:'PATCH', credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  var json = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(json.error || json.message || ('Request failed ('+r.status+')'));
  return json;
}

function _deptOptions(){
  return DEPARTMENTS.map(function(d){ return { value:d, label:d }; });
}
function _employeeOptions(){

async function hrimOpenAssignTraining(){

  if (!modelOpts.length) {
    alert('No training models exist yet. Go to Learning & Development and click "Load Default AI Training Curriculum" first.');

  hrimOpenModal('Assign Training',
    _field('Employee','employeeId','select',{ options:_employeeOptions(), placeholder:'Select employee' }) +
    _field('Training model','trainingModelId','select',{ options:modelOpts, placeholder:'Select course' }) +

    async function(payload){

      delete payload.trainingModelId;
      await _hrimPost('/api/v1/change/training-models/'+modelId+'/assign', payload);
      if (typeof hrimLoadLearnModels === 'function') await hrimLoadLearnModels();

RENDERERS.dash = function(el){

      _kpi('Attrition Risk (High)', highRisk, 'var(--red)', 'Computed by NexGen HR model') +
      _kpi('Open Requisitions', openReqs, 'var(--amber)', openReqs>0?'Live from ATS':'No open reqs') +
      _kpi('Avg Compensation', active.length?_fmtMoney(avgSalary):'—', 'var(--text)', 'All levels blended') +
      _kpi('Exceeding Expectations', exceedsCt, 'var(--green)', 'Latest review cycle') +
    '</div>' +

    '<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px">' +
      '<div class="card">' +
        '<div class="ct">Headcount by Department</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          (deptKeys.length ? deptKeys.sort(function(a,b){return byDept[b]-byDept[a];}).map(function(d){
            var pct = (byDept[d]/maxDept*100).toFixed(0);

            '</div>';
          }).join('') : '<div style="color:var(--muted);font-size:11px;padding:10px 0">No employees yet. Use <b>+ Add Employee</b> on the People page to add your first record.</div>') +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ct">AI Workforce Signals — NexGen HR</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          (highRisk>0
            ? _signal('crit','Attrition risk detected', highRisk+' active employee'+(highRisk>1?'s':'')+' flagged High risk by the live scoring model — review comp bands and tenure gaps')
            : _signal('ok','No high-risk employees', 'Attrition model finds no employees currently flagged High risk')) +
          (openReqs>0

        '<div style="font-size:22px;font-weight:800;color:var(--amber)">'+HRIM_STATS.pendingLeave+'</div>' +

function hrimRenderPeople(){
  var tbody = document.getElementById('people-tbody');
  if (!tbody) return;
  var q = (document.getElementById('pf-search')?.value||'').toLowerCase();
  var dept = document.getElementById('pf-dept')?.value||'';
  var status = document.getElementById('pf-status')?.value||'';
  var risk = document.getElementById('pf-risk')?.value||'';

  var filtered = EMPLOYEES.filter(function(e){
    if (q && !(e.name.toLowerCase().includes(q)||e.title.toLowerCase().includes(q)||e.email.toLowerCase().includes(q))) return false;
    if (dept && e.dept!==dept) return false;
    if (status && e.status!==status) return false;
    if (risk && e.riskLabel!==risk) return false;
    return true;
  }).slice(0,150);

  tbody.innerHTML = filtered.map(function(e){
    return '<tr style="cursor:pointer" onclick="hrimOpenEmployee(\''+e.id+'\')">' +
      '<td><div style="display:flex;align-items:center;gap:8px">' +
        '<div style="width:26px;height:26px;border-radius:50%;background:'+e.avatarBg+';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#0a1628">'+_initials(e.name)+'</div>' +
        '<div><div style="color:var(--text);font-weight:600">'+e.name+'</div><div style="font-size:10px;color:var(--muted)">'+e.id+'</div></div>' +
      '</div></td>' +
      '<td>'+e.title+'</td>' +
      '<td>'+e.dept+'</td>' +
      '<td style="font-size:11px">'+e.location+'</td>' +
      '<td>'+e.tenure+' yrs</td>' +
      '<td><span style="color:'+_perfColor(e.perf)+';font-weight:700">'+e.perf+'</span></td>' +
      '<td><span class="badge" style="background:'+_riskColor(e.riskLabel)+'22;color:'+_riskColor(e.riskLabel)+'">'+e.riskLabel+'</span></td>' +
      '<td><span class="badge '+(e.status==='Active'?'ok':e.status==='On Leave'?'warn':'crit')+'">'+e.status+'</span></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--muted)">No employees match filter</td></tr>';
}

var ATS_REQS = [];
var ATS_CANDIDATES = [];

async function hrimRenderAts(){

      _kpi('Hired (all time)', ATS_CANDIDATES.filter(function(c){return c.stage==='HIRED';}).length, 'var(--green)', 'Auto-creates employee record') +

async function hrimAdvanceCandidate(id){
  var c = ATS_CANDIDATES.find(function(x){return x.id===id;});
  if (!c) return;
  var order = ['APPLIED','SCREEN','INTERVIEW','OFFER','HIRED'];
  var next = order[order.indexOf(c.stage)+1];
  if (!next) return;
  try {
    var result = await _hrimPatch('/api/v1/hrim/candidates/'+id+'/stage', { stage: next });
    if (next==='HIRED' && result.autoCreatedEmployee) {
      await fetchHrimLive();
    }
    hrimRenderAts();
  } catch(e) { alert('Could not advance candidate: '+e.message); }
}

async function hrimLoadLearnModels(){
  var grid = document.getElementById('hrim-learn-models-grid');
  if (!grid) return;
  try {
    var r = await fetch('/api/v1/change/training-models', { credentials:'same-origin' });
    if (!r.ok) throw new Error('unavailable');
    _hrimLearnModels = (await r.json()).data || [];
  } catch(e) { _hrimLearnModels = []; }

  var totalEnroll = _hrimLearnModels.reduce(function(a,m){return a+m.enrollmentCount;},0);
  var totalDone   = _hrimLearnModels.reduce(function(a,m){return a+m.completedCount;},0);
  var avgPct      = totalEnroll ? Math.round((totalDone/totalEnroll)*1000)/10 : 0;
  var kpiEl = document.getElementById('hrim-learn-kpis');
  if (kpiEl) {
    kpiEl.innerHTML =
      _kpi('Training Models', _hrimLearnModels.length, 'var(--ocean)', 'Live catalog') +
      _kpi('Total Enrollments', totalEnroll, 'var(--text)', 'Across all models') +
      _kpi('Avg Completion Rate', avgPct+'%', 'var(--green)', '') +
      _kpi('Completed (all time)', totalDone, 'var(--purple)', '');
  }

  if (!_hrimLearnModels.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;background:rgba(0,194,224,.05);border:1px dashed rgba(0,194,224,.25);border-radius:10px">' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">No training models yet.</div>' +
      '<button onclick="hrimSeedDefaultTrainingModels()" id="hrim-seed-tm-btn" style="padding:9px 18px;background:#00c2e0;border:none;border-radius:7px;color:#0a1628;font-size:12px;font-weight:700;cursor:pointer">Load Default Training Curriculum (11 courses)</button>' +
    '</div>';
    return;
  }

  grid.innerHTML = _hrimLearnModels.map(function(m){
    var col = HRIM_PILLAR_COLORS[m.pillar] || '#6b7280';
    var selected = m.id === _hrimSelectedModelId;
    return '<div class="card" style="cursor:pointer;margin:0;'+(selected?'border:2px solid #00c2e0;background:rgba(0,194,224,.06);':'')+'" onclick="hrimSelectLearnModel(\''+m.id+'\')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
        '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:'+col+'22;color:'+col+'">'+HRIM_PILLAR_LABELS[m.pillar]+'</span>' +
        (selected?'<span style="font-size:10px;font-weight:700;color:#00c2e0">✓ SELECTED</span>':'<span style="font-size:10px;color:var(--muted)">'+m.format+' · '+m.durationHours+'h</span>') +
      '</div>' +
      '<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px">'+m.title+(m.isRequired?' <span style="font-size:9px;font-weight:700;color:#ef4444;vertical-align:middle">● REQUIRED</span>':'')+'</div>' +
      '<div style="font-size:9px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px"><span>COMPLETION</span><span>'+m.completedCount+' / '+m.enrollmentCount+' enrolled</span></div>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:'+m.completionPct+'%;background:linear-gradient(90deg,'+col+',#22c55e)"></div></div>' +
    '</div>';
  }).join('');

  if (!_hrimSelectedModelId) {
    hrimSelectLearnModel(_hrimLearnModels[0].id);
  } else {
    hrimLoadLearnEnrollments(_hrimSelectedModelId);
  }
}

async function hrimSeedDefaultTrainingModels(){
  var btn = document.getElementById('hrim-seed-tm-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    await _hrimPost('/api/v1/change/training-models/seed-defaults', {});
    await hrimLoadLearnModels();
  } catch(e) {
    alert('Could not load default training models: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Load Default Training Curriculum (11 courses)'; }
  }
}

window.hrimSelectLearnModel = function(id){
  _hrimSelectedModelId = id;
  hrimLoadLearnModels();
};

async function hrimLoadLearnEnrollments(modelId){
  var tbody = document.getElementById('hrim-learn-enroll-tbody');
  var titleEl = document.getElementById('hrim-learn-enroll-title');
  if (!tbody) return;
  var model = _hrimLearnModels.find(function(m){ return m.id===modelId; });
  var slug = model ? (model.courseSlug || HRIM_PILLAR_TO_ACADEMY_SLUG[model.pillar]) : null;
  if (titleEl) titleEl.textContent = 'Enrollments — ' + (model ? model.title : '');
  tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">Loading…</td></tr>';
  try {
    var r = await fetch('/api/v1/change/training-models/'+modelId+'/enrollments', { credentials:'same-origin' });
    if (!r.ok) throw new Error('unavailable');
    var rows = (await r.json()).data || [];
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">No one enrolled yet. Click <b>+ Assign Training</b> above.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(function(t){
      var name = t.employee ? (t.employee.firstName+' '+t.employee.lastName) : '—';
      var statusCol = t.status==='COMPLETED'?'ok':t.status==='IN_PROGRESS'?'info':'warn';
      var launchLabel = t.status==='IN_PROGRESS' ? 'Continue Training →' : 'Start Training →';
      var action = t.status==='COMPLETED'
        ? '<span style="font-size:10px;color:#22c55e">✓ Done'+(t.completedAt?' · '+t.completedAt.slice(0,10):'')+'</span>'
        : (slug
            ? '<button onclick="hrimOpenAcademy(\''+t.id+'\',\''+slug+'\')" style="padding:4px 10px;background:rgba(0,194,224,.12);border:1px solid rgba(0,194,224,.35);border-radius:5px;color:#00c2e0;font-size:10px;font-weight:700;cursor:pointer">'+launchLabel+'</button>'
            : '<span style="font-size:10px;color:var(--muted)">No course linked</span>');
      return '<tr><td style="color:var(--text)">'+name+'</td><td>'+t.courseName+'</td>' +
        '<td><span class="badge '+statusCol+'">'+t.status.replace('_',' ')+'</span></td>' +
        '<td>'+(t.dueDate?t.dueDate.slice(0,10):'—')+'</td><td>'+action+'</td></tr>';
    }).join('');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">Enrollment data unavailable right now.</td></tr>';
  }
}

    out.textContent = 'Based on live workforce data across '+active.length+' active employees:\n\n' +
      '• '+highRisk.length+' employees currently flagged as high attrition risk, concentrated in R&D / AI Engineering and Manufacturing Ops.\n' +
      '• Top contributing factors: below-band compensation, tenure without promotion (3+ years), and manager transitions.\n' +
      '• Recommended action: prioritize compensation review for the top 5 flagged profiles this cycle — estimated retention cost is 1/8th the cost of backfilling these roles.\n\n' +
      'Ask a follow-up or select another suggested prompt above.';
  }, 900);
}

// Script runs at end of body, DOM already parsed — render demo data
// immediately (instant paint), then swap to live data as soon as the
// backend responds. hrimNav('dash') is re-run once live data lands so
// the currently visible page reflects it.
hrimNav('dash');
document.getElementById('hdr-headcount').textContent = HEADCOUNT;
_hrimRefreshDeptCache();

fetchHrimLive().then(function(loaded){
  if (!loaded) return;
  document.getElementById('hdr-headcount').textContent = HEADCOUNT;
  // Re-render whichever page is currently active with live data
  var activePage = document.querySelector('.page.active');
  var activeId = activePage ? activePage.id.replace('hp-','') : 'dash';
  hrimNav(activeId);
});

// Refresh live data every 60s so the dashboard stays current without a full reload.
// Skipped while a manual-entry modal is open so it doesn't yank focus mid-form.
setInterval(function(){
  if (document.getElementById('hrim-modal-overlay')) return;
  fetchHrimLive().then(function(loaded){
    if (!loaded) return;
    document.getElementById('hdr-headcount').textContent = HEADCOUNT;
    var activePage = document.querySelector('.page.active');
    var activeId = activePage ? activePage.id.replace('hp-','') : 'dash';
    hrimNav(activeId);
  });
}, 60000);
</script>
</body>
</html>
