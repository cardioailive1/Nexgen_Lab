name: Deploy — NexGen Product

# Triggers whenever the product frontend changes on main
on:
  push:
    branches: [main]
    paths:
      - 'product/**'

jobs:
  deploy-product:
    name: Trigger Render deploy (product)
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_PRODUCT_DEPLOY_HOOK }}"
          echo "Product deploy triggered"
        # RENDER_PRODUCT_DEPLOY_HOOK: set this in GitHub → Settings → Secrets and variables → Actions
        # Get the URL from Render → nexgen-product → Settings → Deploy Hook

      - name: Post deploy summary
        run: |
          echo "### NexGen Product Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Triggered at: $(date -u)" >> $GITHUB_STEP_SUMMARY
