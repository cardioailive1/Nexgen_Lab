# NexGen Pro — balanced production tier
# Base: Qwen/Qwen3.8-27B (dense, native vision-language, Apache 2.0).
# Needs transformers>=5.8.0. QLoRA fits one 80GB GPU (A100/H100).
#
# Steps: see training/PRO_TRAINING.md
#   python inspect_modules.py Qwen/Qwen3.8-27B        # confirm target modules
#   python train_lora.py --config config_pro.yaml --data train.jsonl --preview
#   python train_lora.py --config config_pro.yaml --data train.jsonl --max-steps 5   # smoke test
#   python train_lora.py --config config_pro.yaml --data train.jsonl                 # full run

base_model: "Qwen/Qwen3.8-27B"

train_file: "sample_data/train_example.jsonl"
eval_file: "sample_data/eval_example.jsonl"
output_dir: "checkpoints/nexgen-pro-v1"

max_seq_len: 4096
max_image_pixels: 1400000   # cap vision tokens (~1 per 784 px)
use_4bit: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
# Restrict LoRA to the language model so the vision tower is untouched.
# The regex is a starting point: confirm the layer names with
# inspect_modules.py (the hybrid architecture may use other projection
# names than q/k/v/o) and extend the alternation if needed.
# Qwen3.8-27B is hybrid: 48 linear-attention layers (in_proj_qkv/in_proj_z/out_proj)
# + 16 full-attention layers (q/k/v/o_proj) + MLP (gate/up/down_proj) in all 64.
# Matches both module paths (model.layers.* and model.language_model.layers.*), skips the vision tower.
lora_target_regex: '^(?!.*visual).*layers\.\d+\..*\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|out_proj|gate_proj|up_proj|down_proj)$'

# Loss only on assistant replies.
assistant_only_loss: true
# Chat-template options. Qwen3.x templates have a thinking switch; the Lab
# records have no reasoning traces, so train with thinking off and serve the
# same way. Check with --preview that the rendered text looks right.
chat_template_kwargs:
  enable_thinking: false

learning_rate: 0.0001
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.03

logging_steps: 10
eval_steps: 150
save_steps: 100
save_total_limit: 3
seed: 42
report_to: "none"
